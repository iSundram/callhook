name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Test
        working-directory: backend
        run: go test -race -count=1 ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist/callhook_${GOOS}_${GOARCH}
          cd backend
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o ../callhook ./cmd/callhook
          go build -trimpath -ldflags "-s -w" -o ../callhookctl ./cmd/callhookctl
          cd ..
          if [ "$GOOS" = "windows" ]; then
            mv callhook callhook.exe
            mv callhookctl callhookctl.exe
          fi
          mv callhook* dist/callhook_${GOOS}_${GOARCH}/
          cp backend/README.md README.md LICENSE backend/.env.example dist/callhook_${GOOS}_${GOARCH}/

      - name: Package
        run: |
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a callhook_${{ matrix.goos }}_${{ matrix.goarch }}.zip callhook_${{ matrix.goos }}_${{ matrix.goarch }}
          else
            tar -czf callhook_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz callhook_${{ matrix.goos }}_${{ matrix.goarch }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: callhook_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/callhook_${{ matrix.goos }}_${{ matrix.goarch }}.*

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum callhook_* | tee checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/callhook_*
            dist/checksums.txt
