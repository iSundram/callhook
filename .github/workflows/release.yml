name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Test
        run: go test -race -count=1 ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist/calle_${GOOS}_${GOARCH}
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o calle ./cmd/calle
          go build -trimpath -ldflags "-s -w" -o callectl ./cmd/callectl
          if [ "$GOOS" = "windows" ]; then
            mv calle calle.exe
            mv callectl callectl.exe
          fi
          mv calle* dist/calle_${GOOS}_${GOARCH}/
          cp README.md LICENSE .env.example dist/calle_${GOOS}_${GOARCH}/

      - name: Package
        run: |
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a calle_${{ matrix.goos }}_${{ matrix.goarch }}.zip calle_${{ matrix.goos }}_${{ matrix.goarch }}
          else
            tar -czf calle_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz calle_${{ matrix.goos }}_${{ matrix.goarch }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: calle_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/calle_${{ matrix.goos }}_${{ matrix.goarch }}.*

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum calle_* | tee checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/calle_*
            dist/checksums.txt
